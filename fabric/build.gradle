plugins {
  id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
  id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

version = project.mod_version + "-" + project.minecraft_version + "-fabric"
group = project.mod_group_id

base {
  archivesName = project.mod_id
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

  // P2P: iroh bundle (jar-in-jar via loom include)
  implementation "computer.iroh:iroh:${project.iroh_version}"
  include "computer.iroh:iroh:${project.iroh_version}"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
  include "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${project.kotlinx_coroutines_version}"
  include "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:${project.kotlinx_coroutines_version}"
  implementation "net.java.dev.jna:jna:${project.jna_version}"
  include "net.java.dev.jna:jna:${project.jna_version}"
}

sourceSets {
  main {
    java {
      srcDir "../src/main/java"
    }
    kotlin {
      srcDir "../src/main/kotlin"
    }
    resources {
      srcDir "../src/main/resources"
      srcDir "src/generated/resources"
    }
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
  }
}

tasks.withType(ProcessResources).configureEach {
  var replaceProperties = [
    minecraft_version_min : project.minecraft_version_min,
    minecraft_version_max : project.minecraft_version_max,
    fabric_version_range : project.fabric_version_range,
    fabric_loader_version_range : project.fabric_loader_version_range,
    version: project.mod_version,
    pack_format_number: project.pack_format_number,
  ]
  inputs.properties replaceProperties
  filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
    expand replaceProperties + [project: project]
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.encoding = "UTF-8"
  it.options.release = 25
}

java {
  withSourcesJar()
  sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

jar {
  from("../LICENSE") {
  }
}
