org.gradle.jvmargs = -Xmx4G
org.gradle.daemon = false
org.gradle.configuration-cache=false
org.gradle.debug = false

# Kotlin 2.2.x max target is JVM_24; the mod's Java targets 25. The P2P Kotlin shim
# only reads Java 21 bytecode (computer.iroh), so this mismatch is harmless.
kotlin.jvm.target.validation.mode=warning

# Mod Properties
mod_id = mcwifipnp
mod_version = 2.0.7
mod_group_id = io.github.satxm.mcwifipnp

# The Minecraft version in the development environment
minecraft_version = 26.2

# Fabric Properties on https://fabricmc.net/develop/
fabric_loader_version = 0.19.3
fabric_api_version = 0.156.0+26.2
fabric_loom_version=1.17+

# Forge Properties on https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json
forge_version = 65.1.0

# NeoForge Properties on https://maven.neoforged.net/api/maven/versions/releases/net/neoforged/neoforge
neo_version = 26.2.0.49-beta

# P2P (Iroh NAT hole punching)
# https://central.sonatype.com/artifact/computer.iroh/iroh
iroh_version = 1.1.0
kotlin_version = 2.2.21
kotlinx_coroutines_version = 1.9.0
jna_version = 5.15.0

# Mod Config
# Minecraft
# The minimum minecraft version (inclusive) to run this Mod
minecraft_version_min=26.2-alpha.1
# The maximum minecraft version (exclusive) to run this Mod
minecraft_version_max=27

# Fabric
fabric_version_range = *
fabric_loader_version_range = >=0.18.4

# Forge
forge_version_range = [65,)
forge_loader_version_range = [65,)

# NeoForge
neo_version_range = [26.2.0.0-beta,)
neo_loader_version_range = [2,)

# Resource Pack
pack_format_number = 107.1
